name: Deploy ChatGPT connection

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: faithful-mcp-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run check:mcp
      - name: Preview deployment files and operations
        run: npm run deploy:mcp -- --dry-run
      - name: Deploy and verify the read-only connector
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run deploy:mcp
